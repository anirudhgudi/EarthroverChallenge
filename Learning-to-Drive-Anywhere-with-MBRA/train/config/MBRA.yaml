project_name: frodobot-gnm
run_name: frodobot-gnm
SACSoN: False
keep_learning: True

repo_id: frodobots_dataset
root: /home/mango/Earthrover/frodobots_export

episode-index: 0

late_fusion: False

# training setup
use_wandb: True # set to false if you don't want to log to wandb
train: True
batch_size: 20
eval_batch_size: 20
epochs: 200
gpu_ids: [0]
num_workers: 4
lr: 1e-5
optimizer: adamw
clipping: False
max_norm: 1.
scheduler: "cosine"
warmup: True 
warmup_epochs: 4
cyclic_period: 10
plateau_patience: 3
plateau_factor: 0.5
seed: 0

# model params
model_type: MBRA
obs_encoding_size: 1024
goal_encoding_size: 1024
vision_encoder: nomad_vint
encoding_size: 256
obs_encoder: efficientnet-b0
attn_unet: False
cond_predict_scale: False
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
down_dims: [64, 128, 256]

# diffusion model params
num_diffusion_iters: 10

# mask 
goal_mask_prob: 0.5

# Frodobot data ratio
ratio_f: 0.9
#ratio_f: 0.1
horizon_short: 30

# normalization for the action space
normalize: False

# context
context_type: temporal
context_size: 5 # 5
alpha: 0.5

# distance bounds for distance and action and distance predictions 
distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 3
  max_dist_cat: 20

# action output params
len_traj_pred: 8
learn_angle: True

# dataset specific parameters
image_size: [96, 96] # width, height

datasets:
  frodobot:
    train: 11434305
    test: 11434305
    negative_mining: True
    
datasets_sub: {}

# logging stuff
print_log_freq: 100 # in iterations
image_log_freq: 1000 #0 # in iterations

num_images_log: 30 #0 
pairwise_test_freq: 0 # in epochs
eval_fraction: 0.05
wandb_log_freq: 10 # in iterations
eval_freq: 1 # in epochs

#load_run: xxxx
